name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      distribution-only:
        description: Skip the test matrix and only build and check the distribution
        type: boolean
        default: false
    outputs:
      dist-sha256:
        description: SHA-256 checksums of the files in the checked dist artifact
        value: ${{ jobs.distribution.outputs.sha256 }}

jobs:
  build:
    if: ${{ !inputs.distribution-only }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv pip install -U -r pyproject.toml --all-extras --system
    - name: Test with pytest
      run: |
        coverage run -m pytest && coverage report --fail-under=100

  distribution:

    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Set up the oldest and newest supported Python versions
      uses: actions/setup-python@v7
      with:
        python-version: |
          3.11
          3.15
    - name: Build the sdist and wheel
      id: build
      run: |
        uv build --out-dir dist
        cd dist
        checksums="$(sha256sum -- *)"
        echo "$checksums"
        {
          echo 'sha256<<CHECKSUMS'
          echo "$checksums"
          echo 'CHECKSUMS'
        } >> "$GITHUB_OUTPUT"
    - name: Check the built distribution
      env:
        RELEASE_TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        python ./scripts/check_dist.py dist --python 3.11 --python 3.15 ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
    - name: Upload the checked distribution
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error
        overwrite: true
    - name: Record the checked commit and files
      env:
        CHECKSUMS: ${{ steps.build.outputs.sha256 }}
      run: |
        {
          echo '### Checked distribution'
          echo "Commit: \`$(git rev-parse HEAD)\`"
          echo
          echo '```'
          echo "$CHECKSUMS"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
