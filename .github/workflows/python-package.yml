name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:
    outputs:
      dist-sha256:
        description: SHA-256 checksums of the files in the checked dist artifact
        value: ${{ jobs.distribution.outputs.sha256 }}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv pip install -U -r pyproject.toml --all-extras --system
    - name: Check zlib backend
      id: zlib
      shell: bash
      run: |
        zlib_info="$(python ./scripts/check_zlib.py)"
        echo "$zlib_info"
        zlib_backend="$(python -c "import json, sys; print(json.load(sys.stdin)['zlib_backend'])" <<< "$zlib_info")"
        echo "backend=$zlib_backend" >> "$GITHUB_OUTPUT"
    - name: Test with pytest
      if: steps.zlib.outputs.backend == 'zlib' && matrix.os != 'windows-latest'
      run: |
        coverage run -m pytest && coverage report --fail-under=100
    - name: Test with pytest without zlib-only expected streams
      if: steps.zlib.outputs.backend != 'zlib' || matrix.os == 'windows-latest'
      run: |
        python -m pytest -v -m "not requires_zlib_over_zlib_ng"

  distribution:

    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Set up the oldest and newest supported Python versions
      uses: actions/setup-python@v7
      with:
        python-version: |
          3.11
          3.15
    - name: Build the sdist and wheel
      id: build
      run: |
        uv build --out-dir dist
        cd dist
        checksums="$(sha256sum -- *)"
        echo "$checksums"
        {
          echo 'sha256<<CHECKSUMS'
          echo "$checksums"
          echo 'CHECKSUMS'
        } >> "$GITHUB_OUTPUT"
    - name: Check the built distribution
      env:
        RELEASE_TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        python ./scripts/check_dist.py dist --python 3.11 --python 3.15 ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
    - name: Upload the checked distribution
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error
        overwrite: true
    - name: Record the checked commit and files
      env:
        CHECKSUMS: ${{ steps.build.outputs.sha256 }}
      run: |
        {
          echo '### Checked distribution'
          echo "Commit: \`$(git rev-parse HEAD)\`"
          echo
          echo '```'
          echo "$CHECKSUMS"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
