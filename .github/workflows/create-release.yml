name: Create Release
permissions:
  contents: read

on:
  workflow_dispatch:
    
jobs:
  tests:
    uses: ./.github/workflows/python-package.yml

  linting:
    uses: ./.github/workflows/python-linting.yml

  build:
    needs: [tests, linting]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv pip install -U -r pyproject.toml --all-extras --system
      - name: Create release for the dispatched commit
        env:
          GITHUB_TOKEN: ${{ secrets.GHA_TOKEN }}
        run: python scripts/create_release.py ${{ github.sha }}
