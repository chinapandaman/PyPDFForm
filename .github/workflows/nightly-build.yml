name: Nightly Build

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "00 08 * * *"

jobs:
  close-staled-issues:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv pip install -U -r pyproject.toml --all-extras --system
      - name: Close Staled Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GHA_TOKEN }}
        run: python scripts/close_staled_issues.py --apply

  backup-on-codeberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Git Configs
        run: |
          git config --global user.name 'release-bot'
          git config --global user.email 'bot@domain.com'
      - name: Push mirror to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          CODEBERG_REPO="https://$CODEBERG_TOKEN@codeberg.org/chinapandaman/PyPDFForm-mirror.git"
          git remote add codeberg $CODEBERG_REPO
          git push --mirror codeberg

  check-lowest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and newest supported Python versions
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lowest direct dependencies
        run: uv pip install --resolution=lowest-direct -r pyproject.toml --all-extras --system
      - name: Run tests against lowest direct dependencies
        run: |
          coverage run -m pytest && coverage report --fail-under=100

  nightly-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev image from latest tag
        run: |
          git checkout $(git describe --tags `git rev-list --tags --max-count=1`)
          docker build -t pypdfform-dev .
      - name: Run nightly tests on newest PDF samples
        run: |
          git checkout master
          CONTAINER_ID=$(docker run -i -d --rm -v ./pdf_samples:/pypdfform/pdf_samples pypdfform-dev)
          docker exec -i -u 0 $CONTAINER_ID /bin/bash -c "
            rm -rf PyPDFForm
            pip uninstall PyPDFForm -y
            pip install PyPDFForm
            PYTHONPATH=. pytest -m 'not cli_test'
          "
