name: Deploy Docs
permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install mkdocs
        run: uv pip install -U -r pyproject.toml --all-extras --system
      - name: Deploy docs to GitHub page
        run: |
          git config --global user.name 'release-bot'
          git config --global user.email 'bot@domain.com'
          mike deploy --push --update-aliases $(tag=$(git describe --tags --abbrev=0) && echo "${tag%.*}") latest
          mike set-default --push $(tag=$(git describe --tags --abbrev=0) && echo "${tag%.*}")
