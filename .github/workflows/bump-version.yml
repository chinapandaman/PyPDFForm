name: Bump Version
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version-segment:
        type: choice
        description: Select the version segment to bump
        required: true
        default: "patch"
        options:
          - major
          - minor
          - patch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GHA_TOKEN }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv pip install -U -r pyproject.toml --all-extras --system
      - name: If needed, format the code, then bump version based on the input
        run: |
          ruff format .
          ruff check --fix --select I .
          NEW_VERSION=$(python scripts/bump_version.py ${{ inputs.version-segment }})
          git config --global user.name 'release-bot'
          git config --global user.email 'bot@domain.com'
          git diff --quiet && git diff --staged --quiet || \
          git commit -am "[skip ci]: $(git describe --tags $(git rev-list --tags --max-count=1)) => v$NEW_VERSION"
          git push
