name: Linting
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        uv pip install -U -r pyproject.toml --all-extras --system
    - name: Analyze code with pylint
      run: |
        pylint PyPDFForm
    - name: Analyze code with pyright
      run: |
        pyright .
    - name: Analyze code with ruff
      run: |
        ruff check .
    - name: Type check doc examples
      run: |
        python ./scripts/doc_examples_type_check.py
